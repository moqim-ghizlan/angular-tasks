<div class="container color-dark">
  <div class="col">
    <h2>{{ indexModification === null ? 'Ajouter une tâche' : 'Modifier une tâche' }}</h2>
  </div>
  <div class="col">
    <h2>Mes tâches ({{ nbItems }})</h2>
  </div>
</div>

<div class="container color-light">
  <div class="col">
    <form (ngSubmit)="ajoutItem()">
      <label for="new-item">Nom de la tâche</label>
      <input
        id="new-item"
        name="objectif"
        type="text"
        class="txt"
        placeholder="Saisir une tâche"
        required
        [(ngModel)]="objectifText"
      />
      <div class="actions">
        <button type="submit" class="btn" [disabled]="!objectifText.trim()">
          {{ indexModification === null ? 'Créer' : 'Modifier' }}
        </button>
        @if (indexModification !== null) {
          <button type="button" class="btn delete" (click)="supprimerItem(indexModification)">Supprimer</button>
          <button type="button" class="btn secondary" (click)="annulerModification()">Annuler</button>
        }
      </div>
    </form>
  </div>
  <div class="col">
    @for (objectif of activiteService.objectifs; track $index) {
      <button type="button" class="life-container" animate.enter="anim" [class.editing]="indexModification === $index"
        [attr.aria-pressed]="indexModification === $index" (click)="modifierItem($index)">
        <span>{{ objectif }}</span>
      </button>
    } @empty {
      <p>Aucune tâche pour le moment. Ajoutez votre première tâche.</p>
    }
  </div>
</div>
